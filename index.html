<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Веб-ИИ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #333;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 15px;
            white-space: pre-wrap;
        }
        .user {
            background-color: #2b5278;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot {
            background-color: #262626;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background-color: #1f1f1f;
            border-top: 1px solid #333;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background-color: #2c2c2c;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            margin-left: 10px;
            padding: 0 20px;
            border-radius: 20px;
            border: none;
            background-color: #3a82f6;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>🤖 Мой Веб-ИИ (Нейросеть + Википедия)</header>

<div id="chat-box">
    <div class="msg bot">Привет! Я работаю прямо в твоем браузере. Могу просто поболтать или найти ответ на любой вопрос в интернете!</div>
</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="Напишите сообщение...">
    <button id="send-btn" type="button">➤</button>
</div>

<script>
    const intents = [
        {
            keywords: ["привет", "здравствуй", "здарова", "ку", "хай"],
            replies: ["Привет! Рад видеть тебя в браузере!", "Здарова! О чём пообщаемся?", "Привет! Задавай любой вопрос."]
        },
        {
            keywords: ["дела", "жизнь", "настроение", "поживаешь"],
            replies: ["Отлично! В браузере работать одно удовольствие.", "Всё супер, интернет подключен, готов искать информацию!"]
        },
        {
            keywords: ["кто", "ты", "создал", "зовут", "имя"],
            replies: ["Я твой собственный веб-ИИ, написанный на HTML и JavaScript!", "Меня создал ты прямо на своём телефоне."]
        },
        {
            keywords: ["тему", "поговорим", "скучно", "обсудим"],
            replies: ["Давай обсудим космос! Спроси меня про Марс, чёрные дыры или Илона Маска.", "Можем поговорить про технологии или историю. Напиши любое слово, и я найду о нём факты!"]
        },
        {
            keywords: ["пока", "свидания", "удачи"],
            replies: ["До связи! Вкладка всегда открыта для тебя.", "Пока! Заходи ещё."]
        }
    ];

    function addMessage(text, sender) {
        const chatBox = document.getElementById("chat-box");
        const div = document.createElement("div");
        div.className = "msg " + sender;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function getChatReply(text) {
        const clean = text.toLowerCase().replace(/[?!.,]/g, "");
        const words = clean.split(/\s+/);
        for (let intent of intents) {
            for (let word of words) {
                if (intent.keywords.includes(word)) {
                    const r = intent.replies;
                    return r.at(Math.floor(Math.random() * r.length));
                }
            }
        }
        return null;
    }

    async function searchInternet(query) {
        const stopWords = ["что", "кто", "такое", "такой", "где", "когда", "как", "почему", "зачем", "расскажи", "про", "об", "о", "это", "да"];
        const cleanWords = query.toLowerCase().replace(/[?!.,]/g, "").split(/\s+/).filter(w => !stopWords.includes(w));
        const searchTerm = cleanWords.join(" ") || query;

        try {
            const apiUrl = `https://wikipedia.org{encodeURIComponent(searchTerm)}&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&format=json&origin=*`;
            const res = await fetch(apiUrl);
            const data = await res.json();

            if (!data.query || !data.query.pages) {
                return "Не нашёл в Википедии ничего по запросу «" + searchTerm + "». Попробуй написать 1-2 конкретных слова (например: «Марс» или «Фотосинтез»).";
            }

            const pages = Object.values(data.query.pages);
            const page = pages.at(0);

            if (page && page.extract) {
                let text = page.extract.split("\n").at(0);
                return `🌐 Из Википедии (${page.title}):\n${text}`;
            } else {
                return "Статья найдена, но описание пустое.";
            }
        } catch (e) {
            return "Браузер заблокировал запрос из-за адреса content://. Открой файл через адрес file:///storage/emulated/0/Download/CodingC++/index.html";
        }
    }

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        const chatReply = getChatReply(text);
        if (chatReply) {
            setTimeout(() => addMessage(chatReply, "bot"), 300);
            return;
        }

        const loadingMsg = addMessage("🔍 Ищу ответ в интернете...", "bot");
        const answer = await searchInternet(text);
        loadingMsg.textContent = answer;
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    document.getElementById("user-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
